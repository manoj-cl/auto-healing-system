deploy:
  name: Deploy to EC2
  needs: build

  runs-on: ubuntu-latest
  
  steps:

    - name: Deploy application
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          cd /opt/auto-healer
          docker compose pull 
          docker compose up -d