name: My first Workflow

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 

      - name: Checkout repository
        uses: actions/checkout@v4   # A standard GitHub Actions action that clones your repository into the workflow runner's working directory, allowing subsequent steps to access and work with your code files.
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}    # ${{ }} -> this is GitHub Actions expression syntax
          password: ${{ secrets.DOCKER_TOKEN }}

      # - name: Build Docker image
      #   run: |
      #         docker buildx build \
      #         --platform linux/amd64 \
      #         -t auto-healer:test \
      #         --load \
      #         .

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with: 
          context: .
          platforms: linux/amd64
          push: true
          tags: dockermjrr/auto-healer:latest

      - name: List Docker images
        run: docker images