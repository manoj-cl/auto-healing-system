---

- name: Create application directory
  file:
    path: "{{ app_directory }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Generate docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_directory }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  notify:
    - Restart Auto-healer

- name: Ensure application is started
  shell: |
    docker compose up -d
  args:
    chdir: "{{ app_directory }}"